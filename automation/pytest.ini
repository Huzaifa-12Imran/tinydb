[pytest]
testpaths = unit_tests
python_files = test_*.py
addopts = -ra --strict-markers --strict-config
markers =
    smoke: fast sanity checks, always executed first
    ecp: equivalence class partitioning cases
    bva: boundary value analysis cases
    negative: invalid input and error handling cases
    datadriven: parameterized cases that read an external CSV file
    utils: module 1, tinydb.utils (LRUCache, freeze, FrozenDict)
    queries: module 2, tinydb.queries (Query, QueryInstance)
    middleware: module 3, tinydb.middlewares (Middleware, CachingMiddleware)
    run_order(n): optional numeric order inside a group, lower runs first
